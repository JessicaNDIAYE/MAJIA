# Profil utilisé par le LLM pour adapter les idées et la leçon à ton travail.
profil: >
  Ingénieure IA / data. Je construis des agents LLM, des pipelines RAG,
  des intégrations MCP, du text-to-SQL, du parsing de documents avec l'IA
  et du monitoring/observabilité de systèmes IA. Je veux comprendre les
  spécificités réelles de chaque modèle (forces, limites, prix) pour choisir
  le bon outil et proposer des améliorations concrètes à mon équipe.

# Fenêtre de collecte (jours), volume envoyé au LLM et taille de la sélection.
jours: 7
max_elements: 150
max_par_source: 12   # évite qu'une source très bavarde écrase les autres
max_selection: 25

# Mots-clés par défaut pour les sources marquées `filtrer: true`.
# Une source peut définir ses propres `mots_cles`.
mots_cles:
  - agent
  - agentic
  - tool use
  - MCP
  - model context protocol
  - RAG
  - retrieval
  - LangGraph
  - text-to-SQL
  - evaluation
  - benchmark
  - reasoning
  - LLM
  - Claude
  - Anthropic
  - NVIDIA
  - parsing
  - OCR
  - observability
  - monitoring

# Comparatif prix / qualité (section 💰 de la veille).
prix:
  # Préfixes d'identifiants OpenRouter à suivre, et nombre de modèles récents par fournisseur.
  fournisseurs: [anthropic, openai, google, mistralai, meta-llama, deepseek, qwen, x-ai, nvidia]
  modeles_par_fournisseur: 4

