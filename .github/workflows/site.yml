name: Site web

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Veille IA quotidienne"]
    types: [completed]
  # Filet de sécurité : reconstruit le site chaque soir, au cas où une publication aurait échoué.
  schedule:
    - cron: "43 19 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Construction et publication sont deux jobs séparés (schéma recommandé par GitHub) : l'archive du site
  # est ainsi bien enregistrée avant que la publication ne la cherche.
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main  # récupère la veille que le workflow quotidien vient de commiter
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m veille.site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
