name: Veille IA quotidienne

on:
  schedule:
    - cron: "17 5 * * *"  # chaque jour à 5h17 UTC (~7h à Paris)
  workflow_dispatch:

permissions:
  contents: write

# Une seule veille à la fois : une exécution lancée pendant une autre attend qu'elle se termine.
concurrency:
  group: veille
  cancel-in-progress: false

jobs:
  veille:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Générer et envoyer la veille
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          ARTIFICIAL_ANALYSIS_API_KEY: ${{ secrets.ARTIFICIAL_ANALYSIS_API_KEY }}
        # Si Gemini est saturé malgré les réessais et les modèles de secours, nouvelle tentative 20 min plus tard.
        run: |
          python -m veille.main || { echo "::warning::Échec, nouvel essai dans 20 minutes"; sleep 1200; python -m veille.main; }
      - name: Archiver digest, leçon et idées
        run: |
          git config user.name "JessicaNDIAYE"
          git config user.email "ndiajessi13@gmail.com"
          git add digests lecons idees.md data
          git diff --cached --quiet && exit 0
          git commit -m "Veille du $(date +%F)"
          # Si le dépôt a changé pendant la veille, on récupère ces changements avant de pousser
          # (en cas de conflit sur un fichier de données, la version de cette veille l'emporte).
          for essai in 1 2 3; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            echo "::warning::Envoi refusé, nouvel essai ($essai/3)"; sleep 15
          done
          exit 1
